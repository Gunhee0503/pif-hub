<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 · PIF Learning Hub</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/essential/icons/favicon-32.png">
<style>
@font-face{font-family:'Pretendard';src:url('/fonts/PretendardVariable.woff2') format('woff2-variations');font-weight:45 920;font-display:swap}
:root{--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#86868b;--line:#e5e5ea;--bg:#f5f5f7;--blue:#0071e3;--ok:#248a3d;--bad:#d70015;--warn:#b25000;
  --fund:#2f7d6d;--ess:#b07a22;--spec:#7a4fa3;--wmp:#d2416b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:var(--ink);background:var(--bg);letter-spacing:-.01em;word-break:keep-all;font-size:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.gate{max-width:400px;margin:70px auto;padding:0 20px}
.gate h1{font-size:28px;font-weight:750;letter-spacing:-.04em;margin:8px 0 18px}
.gate .e{color:var(--ink2);font-weight:600;font-size:13px}
.card{background:#fff;border-radius:18px;padding:22px}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.fld input{width:100%;border:1px solid #d2d2d7;border-radius:11px;padding:11px 12px;font-size:15px}
.btn{border:0;border-radius:99px;background:var(--blue);color:#fff;font-weight:600;padding:10px 18px}
.btn.w{width:100%;padding:12px}.btn.sec{background:#fff;color:var(--ink);border:1px solid #d2d2d7}
.btn.sm{padding:6px 12px;font-size:12.5px}.btn.red{background:#fff;color:var(--bad);border:1px solid #f1c2c7}
.lnk{background:none;border:0;color:var(--blue);font-size:13px;margin-top:12px;display:inline-block}
.msg{min-height:18px;font-size:13px;margin-top:10px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
header .in{max-width:1200px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;gap:16px}
header .logo{font-weight:700;font-size:15px;white-space:nowrap}header .logo span{color:var(--ink2);font-weight:500}
header select{border:1px solid #d2d2d7;border-radius:10px;padding:7px 10px;background:#fff;min-width:180px}
header .me{margin-left:auto;font-size:12.5px;color:var(--ink2);text-align:right;white-space:nowrap}
main{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:99px;font-weight:600;color:var(--ink2)}
.tabs button.on{background:var(--ink);color:#fff}
.badge{display:inline-block;min-width:18px;padding:1px 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;margin-left:4px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:16px;padding:16px 18px}.kpi small{color:var(--ink2);font-size:12.5px}.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:4px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--ink2);font-weight:600;background:#fafafc}
tr.cl{cursor:pointer}tr.cl:hover td{background:#f9f9fb}
td.num{font-variant-numeric:tabular-nums}
.pb{display:flex;align-items:center;gap:8px}.pb i{display:block;width:70px;height:6px;background:#eee;border-radius:9px;overflow:hidden}.pb i u{display:block;height:100%;background:var(--c)}
.muted{color:var(--ink3)}
.empty{background:#fff;border-radius:16px;padding:40px;text-align:center;color:var(--ink2)}
.drawer{position:fixed;inset:0 0 0 auto;width:min(760px,100%);background:#fff;z-index:40;box-shadow:-20px 0 60px -30px rgba(0,0,0,.4);overflow-y:auto;padding:22px 24px 60px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:39}
.drawer h2{font-size:24px;font-weight:750;letter-spacing:-.03em}
.drawer .x{position:absolute;top:18px;right:18px;border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;font-size:16px}
.sec{margin-top:24px}.sec h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec h3 i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.sgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.sgrid button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 0;font-size:12px;line-height:1.3}
.sgrid button b{display:block;font-size:14px}
.sgrid button.done{background:#fdf0f4;border-color:#f3c3d1}
.sgrid button.go{background:#fff7e6;border-color:#f5d9a3}
.sgrid button.on{outline:2px solid var(--wmp)}
.wd{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.wd .h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}.wd .h b{font-size:17px}.wd .h span{margin-left:auto;font-weight:700}
.wd .row{display:grid;grid-template-columns:72px 1fr;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:13px;line-height:1.55}
.wd .row>div:first-child{color:var(--ink2);font-weight:600}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.ai{background:#f4f0fb;border-radius:9px;padding:6px 9px;margin-top:4px;color:#3d2a5c}
.mini{width:100%;border-collapse:collapse}.mini th,.mini td{padding:6px 8px;font-size:12.5px;border-bottom:1px solid var(--line)}
.note{font-size:12.5px;color:var(--ink2);margin-top:10px;line-height:1.6}
@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.hide-m{display:none}.sgrid{grid-template-columns:repeat(5,1fr)}header .me{display:none}}
</style>
</head>
<body>
<div id="v-login" class="gate" hidden>
  <div class="e">PIF Learning Hub</div><h1>선생님·원장님 관리자</h1>
  <div class="card">
    <div class="fld"><label for="em">이메일</label><input id="em" type="email" autocomplete="email"></div>
    <div class="fld"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn w" id="go">로그인</button>
    <button class="btn w sec" id="su" style="margin-top:8px">처음이면 가입하기</button>
    <div class="msg" id="lm"></div>
    <div class="note">구문의 지도(BEACON) 관리자와 같은 계정입니다. 원장님이 등록한 이메일만 들어올 수 있어요.</div>
    <button class="lnk" id="rs">비밀번호를 잊었어요</button>
  </div>
</div>

<div id="v-app" hidden>
  <header><div class="in">
    <div class="logo">PIF <span>Hub 관리자</span></div>
    <select id="cls"></select>
    <div class="me"><b id="meName"></b><br><span id="meRole"></span></div>
    <button class="btn sm sec" id="out">로그아웃</button>
  </div></header>
  <main>
    <div class="tabs"><button data-t="students" class="on">학생 현황</button><button data-t="pending">승인 대기<span class="badge" id="pdCount" hidden></span></button><button data-t="words">Word Matching 단어 분석</button></div>
    <div id="body"></div>
    <div class="note">반 만들기·선생님 등록은 <a href="https://syntax-beacon.vercel.app/#admin" target="_blank">구문의 지도 관리자</a>에서 합니다. 학생·반 정보는 두 곳이 같이 씁니다.</div>
  </main>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="drawer" id="drawer" hidden></div>

<script src="/shared/supabase.js"></script>
<script src="/shared/vt.js"></script>
<script src="/matching/data.js"></script>
<script>
'use strict';
const SB = VT.sb, $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const CIRC = '①②③④⑤⑥⑦⑧';
const W = window.WMP, BYW = {}; W.forEach(w => BYW[w.id] = w);
let STAFF = null, CLASSES = [], CUR = null, TAB = 'students', D = { students:[], devices:[], prog:[] };

function say(id,t,ok){ const el=$(id); el.textContent=t||''; el.className='msg'+(t?(ok?' ok':' err'):''); }
function ago(t){ if (!t) return '—'; const d = (Date.now() - new Date(t))/1000; if (d < 3600) return Math.max(1,Math.round(d/60))+'분 전'; if (d < 86400) return Math.round(d/3600)+'시간 전'; if (d < 86400*30) return Math.round(d/86400)+'일 전'; return new Date(t).toLocaleDateString('ko-KR'); }

/* ---------- 로그인 ---------- */
$('go').onclick = async () => {
  say('lm','로그인 중…',true);
  try {
    const s = await SB.auth.getSession(); if (s.data.session && s.data.session.user.is_anonymous) await SB.auth.signOut();
    const { error } = await SB.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value }); if (error) throw error;
    boot();
  } catch(e){ say('lm', VT.errText(e)); }
};
$('pw').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('su').onclick = async () => {
  const email = $('em').value.trim(), password = $('pw').value;
  if (!email || password.length < 8) return say('lm','이메일과 8자 이상 비밀번호를 입력해 주세요.');
  try { const { error } = await SB.auth.signUp({ email, password, options:{ emailRedirectTo: location.origin + '/admin/' } }); if (error) throw error;
    say('lm','메일함의 확인 링크를 누른 뒤 로그인해 주세요.', true); } catch(e){ say('lm', VT.errText(e)); }
};
$('rs').onclick = async () => {
  const email = $('em').value.trim(); if (!email) return say('lm','이메일을 먼저 입력해 주세요.');
  try { const { error } = await SB.auth.resetPasswordForEmail(email, { redirectTo: 'https://syntax-beacon.vercel.app/#admin' }); if (error) throw error;
    say('lm','비밀번호 재설정 메일을 보냈어요.', true); } catch(e){ say('lm', VT.errText(e)); }
};
$('out').onclick = async () => { await SB.auth.signOut(); location.reload(); };

async function boot(){
  const s = await SB.auth.getSession();
  const u = s.data.session && s.data.session.user;
  if (!u || u.is_anonymous) { $('v-login').hidden = false; $('v-app').hidden = true; return; }
  const r = await SB.from('staff').select('*').eq('email', (u.email||'').toLowerCase());
  STAFF = r.data && r.data[0];
  if (!STAFF) { $('v-login').hidden = false; say('lm','등록된 선생님 계정이 아니에요. 원장님께 등록을 요청하세요.'); await SB.auth.signOut(); return; }
  $('v-login').hidden = true; $('v-app').hidden = false;
  $('meName').textContent = STAFF.name || STAFF.email; $('meRole').textContent = STAFF.role === 'owner' ? '원장' : '선생님';
  const c = await SB.from('classes').select('*').order('code'); CLASSES = c.data || [];
  if (!CLASSES.length) { $('body').innerHTML = '<div class="empty">담당 반이 없어요. 구문의 지도 관리자에서 반을 배정받아 주세요.</div>'; return; }
  const saved = localStorage.getItem('pifhub_admin_cls');
  CUR = CLASSES.find(x => x.code === saved) ? saved : CLASSES[0].code;
  $('cls').innerHTML = CLASSES.map(x => `<option value="${esc(x.code)}" ${x.code===CUR?'selected':''}>${esc(x.name)} (${esc(x.code)})</option>`).join('');
  $('cls').onchange = () => { CUR = $('cls').value; localStorage.setItem('pifhub_admin_cls', CUR); load(); };
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { TAB = b.dataset.t; document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); render(); });
  load();
}

async function load(){
  $('body').innerHTML = '<div class="empty">불러오는 중…</div>';
  const [st, dv] = await Promise.all([
    SB.from('students').select('*').eq('class_code', CUR).order('name'),
    SB.from('devices').select('*').eq('class_code', CUR).order('requested_at', { ascending:false })
  ]);
  D.students = st.data || []; D.devices = dv.data || [];
  const ids = D.students.map(s => s.id);
  D.prog = [];
  if (ids.length) { const p = await SB.from('vt_progress').select('student_id,course,unit_id,score,max_score,completed,updated_at').in('student_id', ids); D.prog = p.data || []; }
  D.wmp = null;
  const pend = D.devices.filter(d => d.status === 'pending').length;
  $('pdCount').hidden = !pend; $('pdCount').textContent = pend;
  render();
}
function render(){ if (TAB === 'students') renderStudents(); else if (TAB === 'pending') renderPending(); else renderWords(); }

/* ---------- 학생 현황 ---------- */
function summary(sid){
  const rows = D.prog.filter(r => r.student_id === sid);
  const st = c => rows.find(r => r.course === c && r.unit_id === 'state');
  const mt = rows.filter(r => r.course === 'matching');
  const fin = mt.filter(r => r.completed);
  const last = rows.reduce((a,r) => !a || r.updated_at > a ? r.updated_at : a, null);
  return { fund: st('fundamental'), ess: st('essential'), spec: st('spectrum'), mDone: fin.length, mGo: mt.length - fin.length,
    mAvg: fin.length ? Math.round(fin.reduce((a,r)=>a+Number(r.score||0),0)/fin.length) : null, last };
}
function pbar(r, max, c){ const v = r ? Number(r.score||0) : 0, m = r && r.max_score ? Number(r.max_score) : max; return `<div class="pb" style="--c:${c}"><i><u style="width:${m?v/m*100:0}%"></u></i>${v}/${m}</div>`; }
function renderStudents(){
  if (!D.students.length) { $('body').innerHTML = '<div class="empty">아직 승인된 학생이 없어요.</div>'; return; }
  const S = D.students.map(s => Object.assign({ s }, summary(s.id)));
  const week = Date.now() - 7*86400000;
  const active = S.filter(x => x.last && new Date(x.last) > week).length;
  const allFin = D.prog.filter(r => r.course === 'matching' && r.completed);
  const avg = allFin.length ? Math.round(allFin.reduce((a,r)=>a+Number(r.score||0),0)/allFin.length) : '—';
  let h = `<div class="kpis"><div class="kpi"><small>학생</small><b>${S.length}명</b></div><div class="kpi"><small>최근 7일 학습</small><b>${active}명</b></div>
    <div class="kpi"><small>Word Matching 완료 회차</small><b>${allFin.length}</b></div><div class="kpi"><small>Word Matching 평균</small><b>${avg}${avg==='—'?'':'점'}</b></div></div>
    <table><tr><th>이름</th><th class="hide-m">Fundamental</th><th class="hide-m">Essential</th><th class="hide-m">Spectrum</th><th>Word Matching</th><th>최근 학습</th></tr>`;
  S.forEach(x => {
    h += `<tr class="cl" data-id="${x.s.id}"><td><b>${esc(x.s.name)}</b> <span class="muted">${esc(x.s.last4)}</span></td>
      <td class="hide-m">${pbar(x.fund,4,'var(--fund)')}</td><td class="hide-m">${pbar(x.ess,5,'var(--ess)')}</td><td class="hide-m">${pbar(x.spec,4,'var(--spec)')}</td>
      <td class="num"><b>${x.mDone}</b>/20 ${x.mAvg!=null?`<span class="muted">· 평균 ${x.mAvg}점</span>`:''}${x.mGo?` <span class="muted">· 진행 ${x.mGo}</span>`:''}</td>
      <td class="muted">${ago(x.last)}</td></tr>`;
  });
  $('body').innerHTML = h + '</table>';
  document.querySelectorAll('tr.cl').forEach(r => r.onclick = () => openStudent(r.dataset.id));
}

/* ---------- 승인 ---------- */
function renderPending(){
  const pend = D.devices.filter(d => d.status === 'pending'), rest = D.devices.filter(d => d.status !== 'pending').slice(0, 30);
  let h = pend.length ? `<table><tr><th>이름</th><th>뒷번호</th><th>요청</th><th></th></tr>${pend.map(d => `<tr><td><b>${esc(d.name)}</b></td><td>${esc(d.last4)}</td><td class="muted">${ago(d.requested_at)}</td>
    <td style="text-align:right;white-space:nowrap"><button class="btn sm" data-ok="${d.user_id}">승인</button> <button class="btn sm red" data-no="${d.user_id}">거절</button></td></tr>`).join('')}</table>`
    : '<div class="empty">승인 대기 중인 학생이 없어요.</div>';
  if (rest.length) h += `<div class="sec"><h3>최근 처리한 기기</h3><table><tr><th>이름</th><th>상태</th><th>처리</th></tr>${rest.map(d => `<tr><td>${esc(d.name)} <span class="muted">${esc(d.last4)}</span></td><td>${d.status==='approved'?'<span class="ok">승인</span>':'<span class="bad">거절</span>'}${d.decided_by==='auto'?' <span class="muted">(자동)</span>':''}</td><td class="muted">${ago(d.decided_at)}</td></tr>`).join('')}</table></div>`;
  $('body').innerHTML = h;
  document.querySelectorAll('[data-ok],[data-no]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { error } = await SB.rpc('decide_device', { p_user: b.dataset.ok || b.dataset.no, p_approve: !!b.dataset.ok });
    if (error) { alert(VT.errText(error)); b.disabled = false; return; }
    load();
  });
}

/* ---------- 학생 상세 ---------- */
function closeDrawer(){ $('drawer').hidden = true; $('scrim').hidden = true; }
$('scrim').onclick = closeDrawer;
async function openStudent(sid){
  const s = D.students.find(x => x.id === sid);
  $('drawer').innerHTML = `<button class="x" onclick="closeDrawer()">✕</button><h2>${esc(s.name)}</h2><div class="muted">${esc(CLASSES.find(c=>c.code===CUR).name)} · 뒷번호 ${esc(s.last4)}</div><div class="empty" style="margin-top:20px">불러오는 중…</div>`;
  $('drawer').hidden = false; $('scrim').hidden = false; $('drawer').scrollTop = 0;
  const [p, f] = await Promise.all([
    SB.from('vt_progress').select('*').eq('student_id', sid),
    SB.from('vt_ai_feedback').select('word_id,kind,answer,feedback,created_at').eq('student_id', sid).order('created_at', { ascending:false }).limit(300)
  ]);
  const rows = p.data || [];
  const M = {}; rows.filter(r => r.course === 'matching').forEach(r => { const m = /^s(\d\d)$/.exec(r.unit_id); if (m) M[Number(m[1])] = r; });
  let h = `<button class="x" onclick="closeDrawer()">✕</button><h2>${esc(s.name)}</h2><div class="muted">${esc(CLASSES.find(c=>c.code===CUR).name)} · 뒷번호 ${esc(s.last4)} · AI 피드백 ${ (f.data||[]).length }회</div>`;
  // Word Matching
  h += `<div class="sec" style="--c:var(--wmp)"><h3><i></i>Word Matching · 어휘 매칭 훈련</h3><div class="sgrid">`;
  for (let i = 1; i <= 20; i++) { const r = M[i]; const d = r && r.data;
    const nDone = d ? Object.values(d.words||{}).filter(w => w.phase === 'done').length : 0;
    h += `<button data-s="${i}" class="${r && r.completed ? 'done' : nDone ? 'go' : ''}">${pad(i)}<b>${r && r.completed ? r.score : nDone ? nDone+'/5' : '–'}</b></button>`; }
  h += `</div><div id="sDetail"></div></div>`;
  // Fundamental
  const fr = rows.filter(r => r.course === 'fundamental' && r.unit_id !== 'state').sort((a,b) => a.unit_id.localeCompare(b.unit_id));
  h += `<div class="sec" style="--c:var(--fund)"><h3><i></i>Fundamental</h3>`;
  h += fr.length ? `<table class="mini"><tr><th>Lesson · Part</th><th>최고</th><th>응시</th><th>최근 오답</th><th>최근</th></tr>${fr.map(r => { const at = (r.data && r.data.attempts) || [], last = at[at.length-1] || {};
      return `<tr><td>${esc(r.unit_id.replace('lesson','Lesson ').replace('-p',' · Part '))}</td><td><b>${r.score ?? '—'}%</b></td><td>${at.length}회</td><td class="muted">${esc((last.mistakes||[]).slice(0,6).join(', ')) || '—'}</td><td class="muted">${ago(r.updated_at)}</td></tr>`; }).join('')}</table>` : '<div class="muted">기록 없음</div>';
  h += '</div>';
  // Essential / Spectrum
  const ls = c => { const r = rows.find(x => x.course === c && x.unit_id === 'state'); return (r && r.data && r.data.ls) || {}; };
  const P = v => { try { return JSON.parse(v); } catch(e) { return v; } };
  const e = ls('essential'), eRows = Object.keys(e).filter(k => /^vte_part_done_lesson\d+$/.test(k)).sort();
  h += `<div class="sec" style="--c:var(--ess)"><h3><i></i>Essential</h3>` + (eRows.length ? `<table class="mini"><tr><th>강</th><th>의미 분류</th><th>Part 1</th><th>Part 2</th><th>Part 3</th></tr>${eRows.map(k => { const d = P(e[k]) || {};
      const c = v => v == null ? '<span class="muted">—</span>' : `<span class="${v>=80?'ok':''}">${v}%</span>`;
      return `<tr><td>Lesson ${k.match(/\d+$/)[0]}</td><td>${c(d.cls)}</td><td>${c(d.p1)}</td><td>${c(d.p2)}</td><td>${c(d.p3)}</td></tr>`; }).join('')}</table>` : '<div class="muted">기록 없음</div>') + '</div>';
  const sp = ls('spectrum'), sl = [...new Set(Object.keys(sp).map(k => (k.match(/lesson(\d+)$/)||[])[1]).filter(Boolean))].sort();
  h += `<div class="sec" style="--c:var(--spec)"><h3><i></i>Spectrum</h3>` + (sl.length ? `<table class="mini"><tr><th>강</th><th>의미 분류</th><th>Part 1</th><th>Part 2</th><th>Part 3</th></tr>${sl.map(n => {
      const v = k => sp[k] == null ? '<span class="muted">—</span>' : `${esc(sp[k])}${/score/.test(k)?'%':''}`;
      return `<tr><td>Lesson ${n}</td><td>${sp['vts_cls_done_lesson'+n] ? '<span class="ok">완료</span>' : '<span class="muted">—</span>'}</td><td>${v('vts_p01_score_lesson'+n)}</td><td>${v('vts_p02_score_lesson'+n)}</td><td>${v('vts_p03_score_lesson'+n)}</td></tr>`; }).join('')}</table>` : '<div class="muted">기록 없음</div>') + '</div>';
  $('drawer').innerHTML = h;
  $('drawer').querySelectorAll('.sgrid button').forEach(b => b.onclick = () => {
    $('drawer').querySelectorAll('.sgrid button').forEach(x => x.classList.toggle('on', x === b));
    sessionDetail(M[Number(b.dataset.s)], Number(b.dataset.s));
  });
}
function sessionDetail(r, s){
  const el = $('sDetail');
  if (!r || !r.data) { el.innerHTML = `<div class="note">${s}회차는 아직 시작하지 않았어요.</div>`; return; }
  const d = r.data, ws = W.filter(w => w.session === s);
  let h = `<div class="note">${s}회차 · ${r.completed ? '<b>' + r.score + '</b> / 100 · ' + new Date(d.finishedAt).toLocaleString('ko-KR') : '진행 중'}${d.history && d.history.length > 1 ? ' · 응시 ' + d.history.length + '회 (' + d.history.map(x => x.total).join(' → ') + ')' : ''}</div>`;
  ws.forEach(w => {
    const st = d.words[w.id]; if (!st) { h += `<div class="wd"><div class="h"><b>${pad(w.id)}. ${esc(w.word)}</b><span class="muted">미시작</span></div></div>`; return; }
    const tot = (st.s1Pts||0)+(st.s2Pts||0)+(st.s3Pts||0);
    h += `<div class="wd"><div class="h"><b>${pad(w.id)}. ${esc(w.word)}</b><span>${st.phase === 'done' ? tot + ' / 20' : '<span class="muted">진행 중</span>'}</span></div>`;
    h += `<div class="row"><div>해석</div><div>${esc(st.tr || '—')} ${st.pos ? `<span class="muted">· 품사 ${esc(st.pos)}</span>` : ''}${st.trAI ? `<div class="ai">AI: ${esc(st.trAI.comment)}</div>` : ''}</div></div>`;
    if (st.s1Checked) h += `<div class="row"><div>STEP 1</div><div>${st.s1 === w.answer ? '<span class="ok">정답</span>' : `<span class="bad">오답</span> ${CIRC[st.s1-1]} 선택 (정답 ${CIRC[w.answer-1]} ${esc(w.options[w.answer-1].pattern)})`} · ${st.s1Pts}점</div></div>`;
    if (st.s2Res) h += `<div class="row"><div>STEP 2</div><div>${w.step2_answers.map((a,i) => { const rr = st.s2Res[i] || {}; return `${CIRC[i]} ${rr.correct ? '<span class="ok">○</span>' : rr.correct === false ? '<span class="bad">✕</span>' : '?'} ${esc((st.s2||[])[i] || '빈칸')} <span class="muted">(모범: ${esc(a)}${rr.by==='ai'?' · AI':rr.by==='self'?' · 자기채점':''})</span>`; }).join('<br>')}<br><b>${st.s2Pts ?? '—'}점</b> / 10</div></div>`;
    if (st.s3Tries && st.s3Tries.length) h += `<div class="row"><div>STEP 3</div><div>${st.s3Tries.map((t,i) => `${st.s3Tries.length>1?`<span class="muted">${i+1}차</span> `:''}${esc(t.text)}${t.ai ? `<div class="ai">AI ${t.ai.score}점 · ${esc(t.ai.feedback)}</div>` : ''}`).join('<br>')}${st.s3Final ? `<br><b>${st.s3Pts}점</b> / 6 ${st.s3By==='self'?'<span class="muted">(자기채점)</span>':''}` : ''}</div></div>`;
    h += '</div>';
  });
  el.innerHTML = h;
}

/* ---------- 단어 분석 ---------- */
async function renderWords(){
  if (!D.students.length) { $('body').innerHTML = '<div class="empty">학생이 없어요.</div>'; return; }
  if (!D.wmp) {
    $('body').innerHTML = '<div class="empty">반 전체 답안을 모으는 중…</div>';
    const r = await SB.from('vt_progress').select('student_id,unit_id,data').eq('course','matching').in('student_id', D.students.map(s => s.id));
    D.wmp = r.data || [];
  }
  const agg = {};
  D.wmp.forEach(r => Object.entries((r.data && r.data.words) || {}).forEach(([id, st]) => {
    if (st.phase !== 'done') return;
    const a = agg[id] || (agg[id] = { n:0, s1:0, s2:0, s3:0, wrong:{} });
    a.n++; a.s1 += st.s1Pts||0; a.s2 += st.s2Pts||0; a.s3 += st.s3Pts||0;
    if (st.s1 !== BYW[id].answer && st.s1) a.wrong[st.s1] = (a.wrong[st.s1]||0) + 1;
  }));
  const list = Object.entries(agg).map(([id,a]) => ({ w: BYW[id], a, tot: (a.s1+a.s2+a.s3)/a.n })).sort((x,y) => x.tot - y.tot);
  if (!list.length) { $('body').innerHTML = '<div class="empty">아직 이 반에서 끝낸 단어가 없어요.</div>'; return; }
  $('body').innerHTML = `<div class="note" style="margin:0 0 10px">이 반 학생들이 끝낸 단어를 평균 점수가 낮은 순서로 보여 줍니다. 수업 시간에 다시 다룰 단어를 고를 때 쓰세요.</div>
    <table><tr><th>단어</th><th>회차</th><th>푼 학생</th><th>STEP 1 정답률</th><th class="hide-m">STEP 2 평균</th><th class="hide-m">STEP 3 평균</th><th>평균 합계</th><th class="hide-m">가장 많이 고른 오답</th></tr>
    ${list.map(x => { const top = Object.entries(x.a.wrong).sort((a,b) => b[1]-a[1])[0];
      return `<tr><td><b>${esc(x.w.word)}</b></td><td>${x.w.session}</td><td>${x.a.n}명</td><td>${Math.round(x.a.s1/4/x.a.n*100)}%</td>
      <td class="hide-m">${(x.a.s2/x.a.n).toFixed(1)} / 10</td><td class="hide-m">${(x.a.s3/x.a.n).toFixed(1)} / 6</td><td><b class="${x.tot<12?'bad':''}">${x.tot.toFixed(1)}</b> / 20</td>
      <td class="hide-m">${top ? `${CIRC[top[0]-1]} ${esc(x.w.options[top[0]-1].pattern)} <span class="muted">(${top[1]}명)</span>` : '—'}</td></tr>`; }).join('')}</table>`;
}

if (!SB) { document.body.innerHTML = '<div class="gate"><h1>불러오지 못했어요</h1></div>'; }
else { SB.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { $('v-app').hidden = true; $('v-login').hidden = false; } }); boot(); }
</script>
