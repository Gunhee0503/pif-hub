<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전체 관리자 · PIF Learning Hub</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/img/icons/icon-192.png">
<link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Pretendard';src:url('/fonts/PretendardVariable.woff2') format('woff2-variations');font-weight:45 920;font-display:swap}
:root{--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#86868b;--line:#e5e5ea;--bg:#f5f5f7;--blue:#0071e3;--ok:#248a3d;--bad:#d70015;
  --fund:#2f7d6d;--ess:#b07a22;--spec:#7a4fa3;--wmp:#d2416b;--compass:#2b6cb0;--beacon:#d08a1e;--gram:#2c5f8a;--gfb:#c8323c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:var(--ink);background:var(--bg);letter-spacing:-.01em;word-break:keep-all;font-size:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
[hidden]{display:none!important}
.gate{max-width:400px;margin:60px auto;padding:0 20px}
.gate h1{font-size:28px;font-weight:750;letter-spacing:-.04em;margin:8px 0 18px}
.gate .e{color:var(--ink2);font-weight:600;font-size:13px}
.card{background:#fff;border-radius:18px;padding:22px}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.fld input,.fld select{width:100%;border:1px solid #d2d2d7;border-radius:11px;padding:10px 12px;font-size:15px;background:#fff}
.btn{border:0;border-radius:99px;background:var(--blue);color:#fff;font-weight:600;padding:9px 16px;white-space:nowrap}
.btn.w{width:100%;padding:12px}.btn.sec{background:#fff;color:var(--ink);border:1px solid #d2d2d7}
.btn.sm{padding:6px 12px;font-size:12.5px}.btn.red{background:#fff;color:var(--bad);border:1px solid #f1c2c7}
.btn:disabled{opacity:.5}
.lnk{background:none;border:0;color:var(--blue);font-size:13px;margin-top:12px;display:inline-block}
.msg{min-height:18px;font-size:13px;margin-top:10px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
header .in{max-width:1280px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;gap:18px}
header .logo{font-weight:700;font-size:15px;white-space:nowrap;text-decoration:none;color:inherit}header .logo span{color:var(--ink2);font-weight:500}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:99px;font-weight:600;color:var(--ink2);white-space:nowrap;font-size:13.5px}
.tabs button.on{background:var(--ink);color:#fff}
.badge{display:inline-block;min-width:18px;padding:1px 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;margin-left:4px}
header .me{margin-left:auto;font-size:12.5px;color:var(--ink2);text-align:right;white-space:nowrap}
main{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.bar select,.bar input{border:1px solid #d2d2d7;border-radius:10px;padding:8px 11px;background:#fff;font-size:13.5px}
.bar input{min-width:180px}
.bar .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:16px;padding:14px 16px}.kpi small{color:var(--ink2);font-size:12px}.kpi b{display:block;font-size:24px;font-weight:700;letter-spacing:-.03em;margin-top:4px}
.kpi i{font-style:normal;font-size:12px;color:var(--ink3);font-weight:500}
.tw{overflow-x:auto;border-radius:16px;background:#fff}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:11.5px;color:var(--ink2);font-weight:600;background:#fafafc;position:sticky;top:0}
th .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}
tr.cl{cursor:pointer}tr.cl:hover td{background:#f9f9fb}
td.num{font-variant-numeric:tabular-nums}
.pb{display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}.pb i{display:block;width:56px;height:6px;background:#eee;border-radius:9px;overflow:hidden}.pb i u{display:block;height:100%;background:var(--c)}
.lock{color:#c7c7cc;font-size:12px}
.muted{color:var(--ink3)}
.empty{background:#fff;border-radius:16px;padding:40px;text-align:center;color:var(--ink2)}
.ed{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:99px;color:#fff;background:var(--c)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.cc{background:#fff;border-radius:18px;padding:18px}
.cc .t{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cc .t b{font-size:17px;letter-spacing:-.02em}.cc .t code{font:600 12.5px ui-monospace,monospace;background:var(--bg);padding:3px 8px;border-radius:7px}
.cc .t .n{margin-left:auto;color:var(--ink2);font-size:12.5px}
.cc .row{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:center;margin:9px 0;font-size:13px}
.cc .row>span{color:var(--ink2);font-weight:600;font-size:12px}
.cc select{border:1px solid #d2d2d7;border-radius:9px;padding:6px 9px;background:#fff;font-size:13px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #d2d2d7;background:#fff;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.chip.on{border-color:var(--c);background:var(--c);color:#fff}
.chip:disabled{cursor:default}
.seg{display:inline-flex;background:var(--bg);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cc .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.new{border:2px dashed #d2d2d7;background:transparent}
.drawer{position:fixed;inset:0 0 0 auto;width:min(780px,100%);background:#fff;z-index:40;box-shadow:-20px 0 60px -30px rgba(0,0,0,.4);overflow-y:auto;padding:22px 24px 60px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:39}
.drawer h2{font-size:24px;font-weight:750;letter-spacing:-.03em}
.drawer .x{position:absolute;top:18px;right:18px;border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;font-size:16px}
.vin,.vch{border:1px solid #d2d2d7;border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;background:#fff;box-sizing:border-box}
.vch{resize:vertical}
.rpsec{background:#f5f3ff;border:1px solid #e4dcfb;border-radius:16px;padding:14px 16px}
.rpc{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rpc .seg{background:#fff}.rpc .seg button.on{background:#5b2d8e;color:#fff}
.rpc input[type=date]{border:1px solid #d2d2d7;border-radius:8px;padding:4px 6px;font:inherit;font-size:12.5px}
.memo{width:100%;margin-top:10px;border:1px solid #d2d2d7;border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;resize:vertical;background:#fff}
.rcard{background:#fff;border:1px solid #e5e5ea;border-radius:12px;padding:10px 12px;margin-top:10px}
.rcard .rh{display:flex;gap:8px;align-items:baseline;font-size:13px;margin-bottom:6px}
.rtx{width:100%;border:1px solid #e5e5ea;border-radius:8px;padding:10px;font:inherit;font-size:13.5px;line-height:1.65;resize:vertical}
.ra{display:flex;gap:6px;align-items:center;margin-top:8px}.ra .sp{flex:1}
.ra .btn,.cc .btn.sm{margin-top:0}
.cc .rpc .seg{background:#f5f5f7}
.rplist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rpi{display:inline-flex;align-items:center;border:1px solid #d2d2d7;background:#fff;border-radius:99px;overflow:hidden}
.rpi button{border:0;background:transparent;padding:4px 8px 4px 10px;font-size:12px;color:var(--ink2)}
.rpi .rx{padding:4px 9px 4px 6px;font-size:14px;line-height:1;color:#a1a1a6;border-left:1px solid #ececf0}
.rpi .rx:hover{color:var(--bad);background:#fff1f2}
.rbl{display:flex;flex-direction:column;gap:8px}
.rbi{background:#fff;border-radius:14px;padding:10px 14px}
.rbt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.rbt label{display:flex;align-items:center;gap:6px;min-width:200px}
.rbm{flex:1;min-width:200px;border:1px solid #e5e5ea;border-radius:8px;padding:6px 9px;font:inherit;font-size:13px}
.rst{font-size:12.5px;min-width:80px;text-align:right}
.ld{display:inline-block;width:12px;height:12px;border:2px solid #d9cdf2;border-top-color:#5b2d8e;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.sec{margin-top:24px}.sec h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec h3 i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.sec h3 small{font-weight:500;color:var(--ink3);font-size:12px}
.sgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.sgrid button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 0;font-size:12px;line-height:1.3}
.sgrid button b{display:block;font-size:14px}
.sgrid button.done{background:#fdf0f4;border-color:#f3c3d1}.gsg button.done{background:#e8f0f8;border-color:#bcd0e4}.gsg{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))!important}.sgrid button.go{background:#fff7e6;border-color:#f5d9a3}.sgrid button.on{outline:2px solid var(--wmp)}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ugrid div{border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12px;line-height:1.45}
.ugrid div.done{background:#eef6f0;border-color:#c6e2cd}.ugrid div.go{background:#fff7e6;border-color:#f5d9a3}
.wd{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.wd .h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}.wd .h b{font-size:17px}.wd .h span{margin-left:auto;font-weight:700}
.wd .row{display:grid;grid-template-columns:72px 1fr;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:13px;line-height:1.55;white-space:normal}
.wd .row>div:first-child{color:var(--ink2);font-weight:600}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.ai{background:#f4f0fb;border-radius:9px;padding:6px 9px;margin-top:4px;color:#3d2a5c}
.echo{margin-top:30px;border-top:1px dashed var(--line);padding-top:14px}
.echo>summary{font-size:13px;font-weight:700;color:var(--ink3);cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:28px}
.echo>summary::-webkit-details-marker{display:none}
.echo>summary::before{content:'▸';font-size:11px}.echo[open]>summary::before{content:'▾'}
.echo .eh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 8px;font-size:13px}
.echo .eh b.w{font-weight:800;letter-spacing:.04em}
.echo .st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:#f2f1f5;color:#4a4656}
.echo .st.done{background:#e3f1ef;color:#1f5f66}
.echo details{margin-top:10px}.echo details summary{font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;min-height:24px}
.mini{width:100%;border-collapse:collapse}.mini th,.mini td{padding:6px 8px;font-size:12.5px;border-bottom:1px solid var(--line);position:static}
.note{font-size:12.5px;color:var(--ink2);margin-top:10px;line-height:1.6;white-space:normal}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:.94}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.sgrid{grid-template-columns:repeat(5,1fr)}header .me{display:none}header .in{gap:10px}}
</style>
</head>
<body>
<div id="v-login" class="gate" hidden>
  <a href="/" style="display:inline-block;font-size:13.5px;text-decoration:none;margin-bottom:16px">‹ 처음 화면으로</a>
  <div class="e">PIF Learning Hub</div><h1>전체 관리자</h1>
  <div class="card">
    <div class="fld"><label for="em">이메일</label><input id="em" type="email" autocomplete="email"></div>
    <div class="fld"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn w" id="go">로그인</button>
    <button class="btn w sec" id="su" style="margin-top:8px">처음이면 가입하기</button>
    <div class="msg" id="lm"></div>
    <div class="note">원장님이 등록한 이메일만 들어올 수 있어요. 구문의 지도에서 쓰던 관리자 계정 그대로 쓰면 됩니다.</div>
    <button class="lnk" id="rs">비밀번호를 잊었어요</button>
  </div>
</div>

<div id="v-app" hidden>
  <header><div class="in">
    <a class="logo" href="/" title="처음 화면으로">PIF <span>전체 관리자</span></a>
    <nav class="tabs" id="tabs">
      <button data-t="report" class="on">학습 리포트</button>
      <button data-t="classes">반·수강 관리</button>
      <button data-t="pending">승인 대기<span class="badge" id="pdCount" hidden></span></button>
      <button data-t="reports">AI 리포트</button>
      <button data-t="media">영상·자료</button>
      <button data-t="words">단어·문법 분석</button>
      <button data-t="staff" id="tabStaff" hidden>선생님</button>
    </nav>
    <div class="me"><b id="meName"></b><br><span id="meRole"></span></div>
    <button class="btn sm sec" id="out">로그아웃</button>
  </div></header>
  <main id="body"></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="drawer" id="drawer" hidden></div>
<div class="toast" id="toast"></div>

<script src="/shared/supabase.js"></script>
<script src="/shared/vt.js"></script>
<script src="/shared/echo.js"></script>
<script src="/matching/data.js"></script>
<script src="/grammar/data.js"></script>
<script src="/firstbutton/data.js"></script>
<script>
'use strict';
const SB = VT.sb, $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const CIRC = '①②③④⑤⑥⑦⑧';
const W = window.WMP, BYW = {}; W.forEach(w => BYW[w.id] = w);
const COURSES = [
  { id:'fundamental', name:'Fundamental', c:'var(--fund)' },
  { id:'essential',   name:'Essential',   c:'var(--ess)' },
  { id:'spectrum',    name:'Spectrum',    c:'var(--spec)' },
  { id:'matching',    name:'Word Matching', c:'var(--wmp)' },
  { id:'syntax',      name:'구문의 지도',  c:'#1d1d1f' },
  { id:'grammar',     name:'문법 STEP',    c:'var(--gram)' },
  { id:'gfirst',      name:'그래머 첫단추', c:'var(--gfb)' }
];
const FBU = (window.FB && window.FB.units) || [];
const fbSteps = u => 2 + (u.parts.wa ? 1 : 0) + (u.parts.wb ? 1 : 0) + 2;
const GR = (window.GRAM && window.GRAM.rounds) || [];
const GLV = { '기본':'b', '심화':'a', '실전':'p' };
const gUid = r => (GLV[r.level] || 'x') + pad(r.round);
const gSetPts = (set, t) => { const r = t && t.res; if (!r || r.rows.some(x => x.w == null)) return null; return (r.s1 ? 5 : 0) + r.rows.reduce((a, x) => a + (x.ox ? 2 : 0) + (x.w ? 2 : 0), 0); };
const SYN_READY = 8;   // 구문의 지도 현재 공개 유닛 수 (편별)
let STAFF = null, STAFFS = [], IS_OWNER = false, TAB = 'report';
const D = { classes:[], students:[], devices:[], prog:[], syn:[], ct:[], wmp:null, gram:null };
const F = { cls: localStorage.getItem('pifhub_admin_cls') || 'all', q: '' };

function say(id,t,ok){ const el=$(id); el.textContent=t||''; el.className='msg'+(t?(ok?' ok':' err'):''); }
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),2200); }
function ago(t){ if (!t) return '—'; const d = (Date.now() - new Date(t))/1000; if (d < 3600) return Math.max(1,Math.round(d/60))+'분 전'; if (d < 86400) return Math.round(d/3600)+'시간 전'; if (d < 86400*30) return Math.round(d/86400)+'일 전'; return new Date(t).toLocaleDateString('ko-KR'); }
const teachersOf = code => { const l = D.ct.filter(t => t.class_code === code).map(t => t.email); const c = D.classes.find(x => x.code === code); if (c && c.teacher_email && !l.includes(c.teacher_email)) l.unshift(c.teacher_email); return l; };
const staffName = e => { const t = STAFFS.find(x => x.email === e); return t ? (t.name || t.email) : e; };
const coursesOf = s => s.courses || clsOf(s.class_code).courses;
const clsOf = code => D.classes.find(c => c.code === code) || { name: code, courses: [], edition: 'beacon' };
const errMsg = e => { const m = (e && e.message) || String(e);
  if (/duplicate key|already exists/.test(m)) return '이미 있는 반 코드예요.';
  if (/foreign key|violates/.test(m)) return '학생이나 기기가 연결된 반은 삭제할 수 없어요.';
  if (/check constraint/.test(m)) return '반 코드는 영문 대문자·숫자 2~12자로 정해 주세요.';
  return VT.errText(e); };

/* ---------- 로그인 ---------- */
$('go').onclick = async () => {
  say('lm','로그인 중…',true);
  try {
    const s = await SB.auth.getSession(); if (s.data.session && s.data.session.user.is_anonymous) await SB.auth.signOut();
    const { error } = await SB.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value }); if (error) throw error;
    boot();
  } catch(e){ say('lm', VT.errText(e)); }
};
$('pw').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('su').onclick = async () => {
  const email = $('em').value.trim(), password = $('pw').value;
  if (!email || password.length < 8) return say('lm','이메일과 8자 이상 비밀번호를 입력해 주세요.');
  try { const { error } = await SB.auth.signUp({ email, password, options:{ emailRedirectTo: location.origin + '/admin/' } }); if (error) throw error;
    say('lm','메일함의 확인 링크를 누른 뒤 로그인해 주세요.', true); } catch(e){ say('lm', VT.errText(e)); }
};
$('rs').onclick = async () => {
  const email = $('em').value.trim(); if (!email) return say('lm','이메일을 먼저 입력해 주세요.');
  try { const { error } = await SB.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/admin/' }); if (error) throw error;
    say('lm','비밀번호 재설정 메일을 보냈어요.', true); } catch(e){ say('lm', VT.errText(e)); }
};
$('out').onclick = async () => { await SB.auth.signOut(); location.reload(); };

async function boot(){
  const s = await SB.auth.getSession();
  const u = s.data.session && s.data.session.user;
  if (!u || u.is_anonymous) { $('v-login').hidden = false; $('v-app').hidden = true; return; }

async function load(){
  $('body').innerHTML = '<div class="empty">불러오는 중…</div>';
  const [c, st, dv, sf, ct] = await Promise.all([
    SB.from('classes').select('*').order('code'),
    SB.from('students').select('*').order('name'),
    SB.from('devices').select('*').order('requested_at', { ascending:false }),
    SB.from('staff').select('*').order('role').order('email'),
    SB.from('class_teachers').select('*')
  ]);
  D.ct = ct.data || [];
  D.classes = c.data || []; D.students = st.data || []; D.devices = dv.data || []; STAFFS = sf.data || [STAFF];
  if (F.cls !== 'all' && !D.classes.some(x => x.code === F.cls)) F.cls = 'all';
  const ids = D.students.map(s => s.id);
  D.prog = []; D.syn = []; D.wmp = null; D.gram = null;
  if (ids.length) {
    const [p, q] = await Promise.all([
      SB.from('vt_progress').select('student_id,course,unit_id,score,max_score,completed,updated_at').in('student_id', ids),
      SB.from('progress').select('student_id,unit_id,data,updated_at').in('student_id', ids)
    ]);
    D.prog = p.data || []; D.syn = q.data || [];
  }
  const pend = D.devices.filter(d => d.status === 'pending').length;
  $('pdCount').hidden = !pend; $('pdCount').textContent = pend;
  render();
}
function render(){ ({ report: renderReport, classes: renderClasses, pending: renderPending, words: renderWords, reports: renderReports, media: renderMedia, staff: renderStaff })[TAB](); }

/* ---------- 계산 ---------- */
function synUnit(d){
  d = d || {}; const h = d.heard || [], pass = k => Array.isArray(d[k]) && d[k].some(a => a && a.p);
  const lp = h.filter(x => (x || 0) >= 2).length;
  return { lp, done: lp === 5 && pass('gAtt') && pass('wAtt') && pass('rAtt') };
}
function summary(s){
  const rows = D.prog.filter(r => r.student_id === s.id), sy = D.syn.filter(r => r.student_id === s.id);
  const st = c => rows.find(r => r.course === c && r.unit_id === 'state');
  const fin = rows.filter(r => r.course === 'matching' && r.completed);
  const gfin = rows.filter(r => r.course === 'grammar' && r.completed);
  const fbr = rows.filter(r => r.course === 'gfirst' && r.unit_id !== 'diag'), fbd = rows.find(r => r.course === 'gfirst' && r.unit_id === 'diag');
  const synDone = sy.filter(r => synUnit(r.data).done).length;
  const times = rows.map(r => r.updated_at).concat(sy.map(r => r.updated_at)).filter(Boolean).sort();
  return { s, cls: clsOf(s.class_code), fund: st('fundamental'), ess: st('essential'), spec: st('spectrum'),
    mDone: fin.length, mGo: rows.filter(r => r.course === 'matching' && !r.completed).length,
    mAvg: fin.length ? Math.round(fin.reduce((a,r)=>a+Number(r.score||0),0)/fin.length) : null,
    synDone, synGo: sy.length - synDone, last: times[times.length-1] || null,
    gDone: gfin.length, gGo: rows.filter(r => r.course === 'grammar' && !r.completed).length,
    gAvg: gfin.length ? Math.round(gfin.reduce((a,r)=>a+Number(r.score||0),0)/gfin.length) : null,
    fbDone: fbr.filter(r => r.completed).length, fbGo: fbr.filter(r => !r.completed).length, fbDiag: fbd ? fbd.score : null };
}
function filtered(){
  const q = F.q.trim();
  return D.students.filter(s => (F.cls === 'all' || s.class_code === F.cls) && (!q || s.name.includes(q) || s.last4.includes(q)));
}
function pbar(r, max, c){ const v = r ? Number(r.score||0) : 0, m = r && r.max_score ? Number(r.max_score) : max; return `<div class="pb" style="--c:${c}"><i><u style="width:${m?v/m*100:0}%"></u></i>${v}/${m}</div>`; }
const locked = '<span class="lock">미수강</span>';
function classFilter(){
  return `<select id="fCls"><option value="all">전체 반 (${D.classes.length})</option>${D.classes.map(c => `<option value="${esc(c.code)}" ${F.cls===c.code?'selected':''}>${esc(c.name)} · ${esc(c.code)}</option>`).join('')}</select>`;
}
function bindFilter(re){
  const s = $('fCls'); if (s) s.onchange = () => { F.cls = s.value; localStorage.setItem('pifhub_admin_cls', F.cls); re(); };
  const q = $('fQ'); if (q) q.oninput = () => { F.q = q.value; clearTimeout(bindFilter._t); bindFilter._t = setTimeout(() => { re(); const n = $('fQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
}

  };

const AUD = { parent:'학부모님용', student:'학생용', internal:'내부 기록' };
const ymd = d => { const k = new Date(d.getTime() + 9*3600000); return k.toISOString().slice(0,10); };   // KST 날짜
const RP = { aud:'parent', per:'week', from:'', to:'' };                                             // 마지막 선택 기억
function period(per, from, to){
  const now = new Date(), t = ymd(now);
  if (per === 'custom' && from && to) return from <= to ? { from, to } : { from: to, to: from };
  if (per === 'month') { const d = new Date(now); d.setMonth(d.getMonth() - 1); d.setDate(d.getDate() + 1); return { from: ymd(d), to: t }; }
  return { from: ymd(new Date(now.getTime() - 6*86400000)), to: t };
}
const inP = (t, p) => { if (t == null || t === '') return false; const d = new Date(typeof t === 'number' || /^\d+$/.test(t) ? Number(t) : t); if (isNaN(d)) return false; const k = ymd(d); return k >= p.from && k <= p.to; };
const kd = t => { const d = new Date(typeof t === 'number' || /^\d+$/.test(String(t)) ? Number(t) : t); return isNaN(d) ? null : ymd(d); };
function buildFacts(s, rows, syn, ai, p){
  const cls = clsOf(s.class_code), eff = coursesOf(s), has = c => eff.includes(c), days = new Set(), all = [];
  const mark = t => { const k = kd(t); if (!k) return; all.push(k); if (k >= p.from && k <= p.to) days.add(k); };
  rows.forEach(r => mark(r.updated_at)); syn.forEach(r => mark(r.updated_at)); ai.forEach(a => mark(a.created_at));
  const P = v => { try { return JSON.parse(v); } catch(e) { return v; } };
  const F = { 학생:{ 이름:s.name, 반:cls.name, 구문의지도_편: cls.edition === 'compass' ? 'COMPASS 기본편' : 'BEACON 심화편' },
    기간:{ 시작:p.from, 끝:p.to }, 수강코스: COURSES.filter(c => has(c.id)).map(c => c.name) };
  // Fundamental
  if (has('fundamental')) {
    const st = rows.find(r => r.course === 'fundamental' && r.unit_id === 'state'), tries = [];
    rows.filter(r => r.course === 'fundamental' && r.unit_id !== 'state').forEach(r => ((r.data && r.data.attempts) || []).forEach(a => { mark(a.at);
      if (inP(a.at, p)) tries.push({ 단원: r.unit_id.replace('lesson','Lesson ').replace('-p',' Part '), 점수: a.pct, 틀린단어: (a.mistakes || []).slice(0,8) }); }));
    F.Fundamental = { 누적_완료강: `${st ? Number(st.score||0) : 0}/4`, 기간내_응시: tries.slice(-12) };
  }
  // Essential / Spectrum (기기 기록 묶음: 시각 정보 없음 → 누적)
  const ls = c => { const r = rows.find(x => x.course === c && x.unit_id === 'state'); return { r, d: (r && r.data && r.data.ls) || {} }; };
  if (has('essential')) { const { r, d } = ls('essential');
    F.Essential = { 누적_완료강: `${r ? Number(r.score||0) : 0}/5`, 기간내_학습기록: !!(r && inP(r.updated_at, p)),
      강별_점수: Object.keys(d).filter(k => /^vte_part_done_lesson\d+$/.test(k)).sort().map(k => { const v = P(d[k]) || {}; return { 강: k.replace(/^.*lesson/,''), 의미분류: v.cls, Part1: v.p1, Part2: v.p2, Part3: v.p3 }; }) }; }
  if (has('spectrum')) { const { r, d } = ls('spectrum');
    F.Spectrum = { 누적_통과강: `${r ? Number(r.score||0) : 0}/4`, 기간내_학습기록: !!(r && inP(r.updated_at, p)),
      강별_점수: Object.keys(d).filter(k => /^vts_p01_score_lesson\d+$/.test(k)).sort().map(k => ({ 강: k.replace(/^.*lesson/,''), 점수: Number(d[k]) })) }; }
  // Word Matching
  if (has('matching')) {
    const ms = rows.filter(r => r.course === 'matching' && /^s\d\d$/.test(r.unit_id)), done = [], going = [];
    ms.forEach(r => { const d = r.data || {}, n = Number(r.unit_id.slice(1)); (d.history || []).forEach(x => mark(x.at)); mark(d.savedAt);
      const ws = W.filter(w => w.session === n);
      (d.history || []).filter(x => inP(x.at, p)).forEach(x => done.push({ 회차: n, 점수: x.total }));
      if (!d.finishedAt && inP(d.savedAt, p)) going.push({ 회차: n, 진행단어: Object.values(d.words || {}).filter(w => w.phase === 'done').length + '/5' });
      if ((d.history || []).some(x => inP(x.at, p))) {
        const weak = ws.filter(w => { const st = (d.words || {})[w.id]; return st && st.phase === 'done' && ((st.s1Pts || 0) === 0 || (st.s2Pts || 0) < 8); }).map(w => w.word);
        if (weak.length) done[done.length - 1].약한단어 = weak;
      } });
    const fin = ms.filter(r => r.completed);
    F.WordMatching = { 누적_완료회차: `${fin.length}/20`, 누적_평균: fin.length ? Math.round(fin.reduce((a,r)=>a+Number(r.score||0),0)/fin.length) : null,
      기간내_완료: done, 기간내_진행중: going };
  }

  if (has('syntax')) {
    const tot = syn.filter(r => synUnit(r.data).done).length, touched = syn.filter(r => inP(r.updated_at, p));
    F.구문의지도 = { 누적_완료유닛: `${tot}/${SYN_READY}`, 기간내_학습유닛: touched.map(r => ({ 유닛: r.unit_id.replace(/^c-/,'').replace('ch','Ch').replace('-u',' U'), 완료: synUnit(r.data).done, 듣기: synUnit(r.data).lp + '/5' })) };
  }
  // 문법 STEP
  if (has('grammar')) {
    const out = [], miss = {}, made = [];
    GR.forEach(g => { const r = rows.find(x => x.course === 'grammar' && x.unit_id === gUid(g)); if (!r || !r.data) return; const d = r.data;
      (d.history || []).forEach(x => mark(x.at)); mark(d.savedAt);
      const touched = inP(d.savedAt, p) || (d.history || []).some(x => inP(x.at, p)); if (!touched) return;
      out.push({ 회차: `${g.level} ${pad(g.round)}회`, 점수: d.finishedAt && inP(d.finishedAt, p) ? d.total : null, 상태: d.finishedAt ? '완료' : '진행 중',
        SET별: g.sets.map(set => { const t = (d.sets || {})[set.set]; return t && t.res ? `${pad(set.set)}: ${gSetPts(set, t) ?? '채점 중'}/25` : `${pad(set.set)}: 미완료`; }) });
      g.sets.forEach(set => { const t = (d.sets || {})[set.set]; if (!t || !t.res) return;
        set.items.forEach((k, i) => { const rr = t.res.rows[i] || {}, v = t.rows[i] || {};
          if (!rr.ox || rr.w === false) miss[k.point] = (miss[k.point] || 0) + 1;
          if (v.ox === 'O' && rr.ox && v.a && made.length < 4) made.push({ 원래: (set.passage.find(x => x.n === k.n) || {}).t, 학생이만든오답: v.a, 이유: v.why, 판정: rr.w ? '정답' : rr.w === false ? '오답' : '미판정' }); }); }); });
    F.문법STEP = { 기간내_회차: out, 틀린_문법포인트: Object.entries(miss).sort((a,b) => b[1]-a[1]).map(([k,v]) => `${k}(${v})`), 학생이_만든_오답_예: made };
  }
  // 그래머 첫단추
  if (has('gfirst')) {
    const fr = rows.filter(r => r.course === 'gfirst' && r.unit_id !== 'diag'), touched = [];
    fr.forEach(r => { const d = r.data || {}; mark(d.savedAt); const u = FBU.find(x => x.id === r.unit_id); if (!u) return;
      if (inP(d.savedAt, p) || inP(r.updated_at, p)) touched.push({ 단원: `${u.no} ${u.title}`, 진행: r.completed ? '완료' : `${d.prog || ''} 단계`,
        실전문항: d.quiz && d.quiz.graded ? `${d.quiz.score}/${d.quiz.max}` : '미응시', 워크북B: d.wb && d.wb.total ? `${d.wb.ok}/${d.wb.total}` : null,
        자가체크: d.checksSaved ? `${(d.checks || []).filter(Boolean).length}/${u.checks.length}` : null }); });
    const dg = rows.find(r => r.course === 'gfirst' && r.unit_id === 'diag'), at = (dg && dg.data && dg.data.attempts) || [];
    at.forEach(a => mark(a.at));
    F.그래머첫단추 = { 누적_완료단원: `${fr.filter(r => r.completed).length}/${FBU.length}`, 기간내_학습단원: touched,
      종합진단: at.map(a => ({ 날짜: kd(a.at), 점수: `${a.score}/30`, BASIC: `${a.basic}/20`, Beyond: `${a.beyond}/10`, 기간내: inP(a.at, p), 다시볼단원: [...new Set(a.wrong.map(w => w.unit))] })).slice(-3) };
  }

  return F;
}

async function copyText(t){ try { await navigator.clipboard.writeText(t); toast('복사했어요. 카카오톡에 붙여 넣으세요.'); } catch(e) { toast('복사하지 못했어요. 글을 길게 눌러 직접 복사해 주세요.'); } }
function repCard(r){
  return `<div class="rcard" data-id="${r.id || ''}"><div class="rh"><b>${AUD[r.audience] || ''}</b><span class="muted">${r.period_from} ~ ${r.period_to}</span>${r.status === 'done' ? '<span class="ok">검토 완료</span>' : '<span class="muted">초안</span>'}</div>

    <div class="ra"><button class="btn sm" data-a="copy">복사</button><button class="btn sm sec" data-a="save">검토 완료로 저장</button><span class="sp"></span>${r.id ? '<button class="btn sm red" data-a="del">삭제</button>' : '<span class="muted" style="font-size:12px">저장 안 됨</span>'}</div></div>`;

async function deleteReport(r){
  if (!confirm(`이 리포트를 삭제할까요? (${AUD[r.audience] || ''} · ${r.period_from} ~ ${r.period_to})\n삭제하면 되돌릴 수 없어요.`)) return false;

  if (error) { toast(errMsg(error)); return false; }

function bindRepCard(box, r, onDel){
  const tx = box.querySelector('.rtx');

  box.querySelector('[data-a=save]').onclick = async () => { if (!r.id) return toast('저장할 수 없는 초안이에요.');

/* ECHO 다시듣기 기록 (syntax-drill의 echo 함수가 허브 로그인을 확인하고 돌려줌) */
async function echoStudent(s){

    const L = r.lessons || [], by = {}; (r.listens || []).forEach(x => by[x.lesson_id] = x);
    if (!L.length) { box.innerHTML = '이 반에 ECHO로 공개된 수업이 아직 없어요.'; return; }

      <table class="mini"><tr><th>수업 날짜</th><th>수업</th><th>기록</th><th>들은 횟수</th><th>마지막</th></tr>${L.map(l => { const x = by[l.id];
        return `<tr><td>${md(l.lesson_date)}</td><td>${esc(l.title)} · ${l.count}문장</td><td>${x ? `<span class="st ${x.completed ? 'done' : ''}">${x.completed ? '끝까지 들음' : '열어 봄'}</span>` : '<span class="muted">—</span>'}</td><td>${x ? x.plays : 0}</td><td class="muted">${x ? ago(x.last_at) : '—'}</td></tr>`; }).join('')}</table>
      <details id="echoCls"><summary>${esc(clsOf(s.class_code).name)} 반 전체 보기</summary><div id="echoClsBox" class="muted" style="margin-top:6px">불러오는 중…</div></details>`;
    $('echoCls').addEventListener('toggle', async () => {

        const kids = D.students.filter(x => x.class_code === s.class_code), n = kids.length;
        $('echoClsBox').className = '';
        $('echoClsBox').innerHTML = `<table class="mini"><tr><th>수업</th><th>끝까지 들음</th><th>열어 봄</th><th>반 인원</th></tr>${(c.lessons || []).map(l => {
          const ls = (c.listens || []).filter(x => x.lesson_id === l.id), d = ls.filter(x => x.completed);
          const names = d.map(x => (kids.find(k => k.id === x.student_id) || {}).name).filter(Boolean);
          return `<tr><td>${md(l.lesson_date)} ${esc(l.title)}</td><td><b>${d.length}</b>명 <span class="muted">${esc(names.slice(0,8).join(', '))}${names.length > 8 ? ' 외' : ''}</span></td><td>${ls.length - d.length}명</td><td>${n}명</td></tr>`; }).join('')}</table>`;

  $('rbCopy').onclick = () => { const t = studs.map(s => RB2[s.id]).filter(x => x.rep).map(x => { const s = studs.find(z => RB2[z.id] === x); const tx = document.querySelector(`.rbi[data-sid="${s.id}"] .rtx`); return `[${s.name}]\n${tx ? tx.value : x.rep.body}`; }).join('\n\n──────────\n\n');

async function renderWords(){
  const studs = filtered();
  let h = `<div class="bar">${classFilter()}<span class="note" style="margin:0">학생들이 끝낸 단어를 평균 점수가 낮은 순서로 보여 줍니다. 수업에서 다시 다룰 단어를 고를 때 쓰세요.</span></div>`;
  if (!studs.length) { $('body').innerHTML = h + '<div class="empty">학생이 없어요.</div>'; bindFilter(renderWords); return; }
  if (!D.wmp) {
    $('body').innerHTML = h + '<div class="empty">답안을 모으는 중…</div>';
    const r = await SB.from('vt_progress').select('student_id,unit_id,data').eq('course','matching').in('student_id', D.students.map(s => s.id));
    D.wmp = r.data || [];
  }
  const ids = new Set(studs.map(s => s.id)), agg = {};
  D.wmp.filter(r => ids.has(r.student_id)).forEach(r => Object.entries((r.data && r.data.words) || {}).forEach(([id, st]) => {
    if (st.phase !== 'done' || !BYW[id]) return;
    const a = agg[id] || (agg[id] = { n:0, s1:0, s2:0, tr:0, wrong:{} });
    a.n++; a.s1 += st.s1Pts||0; a.s2 += st.s2Pts||0; if (st.trOk) a.tr++;
    if (st.s1 !== BYW[id].answer && st.s1) a.wrong[st.s1] = (a.wrong[st.s1]||0) + 1;
  }));
  const list = Object.entries(agg).map(([id,a]) => ({ w: BYW[id], a, tot: (a.s1+a.s2)/a.n })).sort((x,y) => x.tot - y.tot);
  if (!D.gram) { const r = await SB.from('vt_progress').select('student_id,unit_id,data').eq('course','grammar').in('student_id', D.students.map(s => s.id)); D.gram = r.data || []; }
  const gH = gramAnalysis(ids);
  if (!list.length) { $('body').innerHTML = h + '<div class="empty">아직 끝낸 단어가 없어요.</div>' + gH; bindFilter(renderWords); return; }
  $('body').innerHTML = h + `<div class="tw"><table><tr><th>단어</th><th>회차</th><th>푼 학생</th><th>STEP 1 정답률</th><th>STEP 2 평균</th><th>해석 빈칸 정답률</th><th>평균 합계</th><th>가장 많이 고른 오답</th></tr>
    ${list.map(x => { const top = Object.entries(x.a.wrong).sort((a,b) => b[1]-a[1])[0];
      return `<tr><td><b>${esc(x.w.word)}</b></td><td>${x.w.session}</td><td>${x.a.n}명</td><td>${Math.round(x.a.s1/6/x.a.n*100)}%</td>
      <td>${(x.a.s2/x.a.n).toFixed(1)} / 14</td><td>${Math.round(x.a.tr/x.a.n*100)}%</td><td><b class="${x.tot<12?'bad':''}">${x.tot.toFixed(1)}</b> / 20</td>
      <td>${top ? `${CIRC[top[0]-1]} ${esc(x.w.options[top[0]-1].pattern)} <span class="muted">(${top[1]}명)</span>` : '—'}</td></tr>`; }).join('')}</table></div>` + gH;
  bindFilter(renderWords);
}
function gramAnalysis(ids){
  const agg = {};
  (D.gram || []).filter(r => ids.has(r.student_id)).forEach(r => { const g = GR.find(x => gUid(x) === r.unit_id); if (!g || !r.data) return;
    g.sets.forEach(set => { const t = (r.data.sets || {})[set.set]; if (!t || !t.res) return;
      set.items.forEach((k, i) => { const rr = t.res.rows[i]; if (!rr) return; const key = g.id + '|' + set.set + '|' + k.n;
        const a = agg[key] || (agg[key] = { g, set, k, n:0, ox:0, w:0 }); a.n++; if (rr.ox) a.ox++; if (rr.w) a.w++; }); }); });
  const list = Object.values(agg).sort((x, y) => (x.ox + x.w) / x.n - (y.ox + y.w) / y.n);
  const pdfs = GR.filter(g => g.pdf);
  let h = `<h3 style="margin:30px 0 8px;font-size:18px">문법 STEP · 밑줄별 분석</h3>
    ${pdfs.length ? `<div class="bar" style="margin-bottom:10px"><span class="note" style="margin:0">학습지 PDF</span>${pdfs.map(g => `<button class="btn sm sec" data-gpdf="${esc(g.id)}" data-kind="student">${esc(g.level)} ${pad(g.round)}회 학습지</button><button class="btn sm sec" data-gpdf="${esc(g.id)}" data-kind="full">${esc(g.level)} ${pad(g.round)}회 정답 포함</button>`).join('')}</div>` : ''}<div class="note" style="margin:0 0 10px">채점까지 마친 밑줄을 정답률이 낮은 순서로 보여 줍니다. O/X는 판단, 고치기·오답은 X를 바르게 고치거나 O에서 오답을 만든 것.</div>`;
  if (!list.length) return h + '<div class="empty">아직 채점된 문법 과제가 없어요.</div>';
  return h + `<div class="tw"><table><tr><th>회차</th><th>SET</th><th>밑줄</th><th>문법 포인트</th><th>정답</th><th>푼 학생</th><th>O/X 정답률</th><th>고치기·오답 정답률</th></tr>
    ${list.map(a => { const orig = (a.set.passage.find(x => x.n === a.k.n) || {}).t || ''; const pc = v => Math.round(v / a.n * 100);
      return `<tr><td>${esc(a.g.level)} ${pad(a.g.round)}</td><td>${pad(a.set.set)}</td><td>${CIRC[a.k.n-1]} <b>${esc(orig)}</b></td><td>${esc(a.k.point)}</td><td>${a.k.ox}</td><td>${a.n}명</td>
      <td><b class="${pc(a.ox)<60?'bad':''}">${pc(a.ox)}%</b></td><td><b class="${pc(a.w)<60?'bad':''}">${pc(a.w)}%</b></td></tr>`; }).join('')}</table></div>`;
}

  catch(e){ toast('PDF를 내려받지 못했어요: ' + (e.code || e.message)); }
  b.disabled = false; b.textContent = t;
});
if (!SB) { document.body.innerHTML = '<div class="gate"><h1>불러오지 못했어요</h1></div>'; }
else { SB.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { $('v-app').hidden = true; $('v-login').hidden = false; } }); boot(); }
</script>
</body>
</html>
