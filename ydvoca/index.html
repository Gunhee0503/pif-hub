<style>
:root{--dk:#163A32;--tl:#0B6E62;--mint:#D6EDE5;--mint2:#EEF7F3;--or:#B24A1E;--orbg:#FBEEE6;--cream:#F5F0E7;--en:'Oswald',var(--sans);
  --paper:#f4f6f5;--card:#fff;--line:#d7e3de;--ink:#1C2B27;--ink2:#56615D}
body{background:var(--paper)}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 96px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top button{background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:13px;color:var(--ink2)}
.top .t{flex:1;font:500 12px/1 var(--en);letter-spacing:.22em;color:var(--tl)}
.hero{background:var(--dk);color:#EAF5F1;border-radius:22px;padding:24px 22px;margin-bottom:18px;position:relative;overflow:hidden}
.hero .e{font:500 12px/1 var(--en);letter-spacing:.28em;color:#A9D3C6}
.hero h1{font:700 26px/1.3 var(--sans);margin:10px 0 6px;letter-spacing:-.02em}
.hero p{margin:0;font-size:14px;line-height:1.65;color:#C9E3DA}
.hero .rings{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;box-shadow:0 0 0 14px rgba(255,255,255,.04),0 0 0 32px rgba(255,255,255,.035),0 0 0 54px rgba(255,255,255,.03)}
.steps{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.steps span{font-size:12.5px;padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.1)}
.steps span b{font-family:var(--en);font-weight:500;margin-right:5px;color:#E8B48C}
.sec{margin:26px 0 10px;display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.sec b{white-space:nowrap}
.sec b{font:600 15px/1 var(--en);letter-spacing:.14em;color:var(--dk)}
.sec span{font-size:13px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.lc{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--ink);text-decoration:none;display:block}
.lc:hover{border-color:var(--tl)}
.lc .n{font:300 34px/1 var(--en);color:var(--tl)}
.lc .tt{font-weight:800;font-size:16px;margin:6px 0 2px}
.lc .s{font-size:12px;color:var(--ink2);line-height:1.45;min-height:34px}
.lc .ic{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;padding:4px 8px;border-radius:99px;background:#eef2f0;color:#7b8783}
.pill.on{background:var(--mint);color:var(--dk)} .pill.pass{background:var(--tl);color:#fff} .pill.re{background:var(--orbg);color:var(--or)}
.soon{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:16px;color:var(--ink2);font-size:13.5px;line-height:1.6}
.soon b{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 4px;display:flex;align-items:center;gap:9px}
.card h2 .no{font:500 12px/1 var(--en);letter-spacing:.12em;color:#fff;background:var(--tl);border-radius:6px;padding:4px 7px}
.card .d{font-size:13.5px;line-height:1.65;color:var(--ink2);margin:0 0 12px}
.vbox{position:relative;width:100%;aspect-ratio:16/9;background:#0d1f1b;border-radius:14px;overflow:hidden}
.vbox .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#A9D3C6;font-size:13.5px;text-align:center;padding:16px}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.b{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.b.main{background:var(--dk);border-color:var(--dk);color:#fff} .b.or{background:var(--or);border-color:var(--or);color:#fff}
.b:disabled{opacity:.5}
.role{margin-left:auto;font:700 10.5px/1 var(--en);letter-spacing:.08em;padding:5px 8px;border-radius:99px;white-space:nowrap}
.role.learn{background:var(--mint2);color:var(--tl)} .role.practice{background:#e7ebf3;color:#1e293b} .role.check{background:var(--orbg);color:var(--or)} .role.apply{background:#eef2f0;color:#56615d}
.card.practice{border-color:#c9d1e0;background:#f7f9fc}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.dual .dc{border-radius:14px;padding:13px 14px;font-size:12.5px;line-height:1.55;color:var(--ink2)}
.dual .dc b{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ink);margin-bottom:4px}
.dual .dc.bc{background:var(--mint2)} .dual .dc.app{background:#eef1f7}
.dual .dc img{width:22px;height:22px;border-radius:6px}
.dual .k{display:inline-block;font:700 10.5px/1 var(--en);letter-spacing:.08em;padding:4px 7px;border-radius:99px;margin-left:auto}
.dual .bc .k{background:#fff;color:var(--tl)} .dual .app .k{background:#fff;color:#1e293b}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--ink2);margin:2px 0 12px}
.flow span{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 10px} .flow i{font-style:normal;color:#9aa5a1}
@media (max-width:520px){.dual{grid-template-columns:1fr}}
.b .ic{flex:none} .b.pdf{border-color:var(--tl);color:var(--tl)}
.b.app{background:#1e293b;border-color:#1e293b;color:#fff;padding:7px 12px 7px 7px}
.b.app .ai{width:26px;height:26px;border-radius:7px;flex:none;background:#fff}
.b.app .go{font-size:18px;line-height:1;opacity:.7;margin-left:2px}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 12px}
.res div{background:var(--mint2);border-radius:12px;padding:9px 6px;text-align:center}
.res i{display:block;font:500 11px/1 var(--en);letter-spacing:.14em;color:var(--tl);font-style:normal}
.res b{font:500 22px/1.2 var(--en)}
.res .x{background:var(--cream)} .res .x i{color:var(--ink)}
.banner{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.55;margin-bottom:12px}
.banner.ok{background:var(--tl);color:#fff} .banner.no{background:var(--orbg);color:var(--or)}
.note{font-size:12.5px;line-height:1.6;color:var(--ink2);background:var(--mint2);border-radius:12px;padding:10px 12px}
/* 시험 */
.st{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--c);padding-bottom:7px;margin:26px 0 8px}
.st .k{min-width:30px;height:30px;padding:0 6px;background:var(--c);color:#fff;font:500 17px/30px var(--en);text-align:center}
.st .tt{font-weight:900;color:var(--c);font-size:15.5px}
.st .dd{font-size:12px;color:var(--ink2)}
.q{padding:11px 0;border-bottom:1px solid var(--line)}
.q .qn{font:500 15px/1 var(--en);color:var(--c);margin-right:8px}
.q .s{font-size:15.5px;line-height:1.6}
.q mark{background:#FFEFA0;font-weight:700;padding:0 2px}
.q .hint{display:inline-block;font-size:11.5px;color:var(--tl);background:var(--mint2);border:1px solid var(--line);padding:1px 7px;margin-left:4px;margin-bottom:0}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
@media(max-width:560px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opts label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 9px;font-size:14px;background:#fff;cursor:pointer}
.opts input{accent-color:var(--tl)}
.opts label.sel{border-color:var(--tl);background:var(--mint2)}
.opts label.ok{border-color:var(--tl);background:var(--tl);color:#fff} .opts label.bad{border-color:var(--or);background:var(--orbg)}
.blank{font:600 15px var(--sans);border:0;border-bottom:2px solid var(--ink);background:transparent;padding:2px 4px;width:var(--w,9em);text-align:center;letter-spacing:.04em}
.blank:focus{outline:none;border-color:var(--tl);background:var(--mint2)}
.blank.ok{border-color:var(--tl);color:var(--tl)} .blank.bad{border-color:var(--or);color:var(--or);text-decoration:line-through}
.ko{font-size:13.5px;color:var(--ink2);margin-top:4px;line-height:1.55} .ko u{font-weight:800;color:var(--ink);text-underline-offset:3px}
.b1{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.bank{display:flex;flex-wrap:wrap;gap:6px;background:var(--orbg);padding:10px;border-radius:12px;margin:4px 0 6px}
.bank span{background:#fff;border:1px solid var(--line);padding:3px 9px;font-weight:700;font-size:13.5px;border-radius:8px}
.bank span.used{opacity:.35;text-decoration:line-through}
select.pick{font:600 14px var(--sans);border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:#fff;min-width:150px}
select.pick.ok{border-color:var(--tl);background:var(--mint2)} select.pick.bad{border-color:var(--or);background:var(--orbg)}
.fb{font-size:12.5px;margin-top:6px;line-height:1.5}
.fb.ok{color:var(--tl)} .fb.bad{color:var(--or)}
.chal{border:1.5px dashed var(--ink);background:var(--cream);border-radius:14px;padding:4px 14px 10px;margin-top:22px}
.sticky{position:sticky;bottom:12px;margin-top:22px;display:flex;gap:8px;justify-content:center}
.sticky .b{box-shadow:0 10px 26px -12px rgba(0,0,0,.45)}
/* 요약문 */
.exam img{width:100%;border:1px solid var(--line);border-radius:12px;display:block;background:#fff}
.exam .aw{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.exam .aw label{display:flex;align-items:center;gap:6px;font:500 14px var(--en)}
.exam .ans{background:var(--mint2);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.7;margin-top:8px}
.exam .ans b{color:var(--tl)}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);background:var(--dk);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
/* 어휘 로드맵 지도 (두 갈래 길) */
.mapstrip{display:flex;align-items:center;gap:12px;width:100%;max-width:460px;min-height:56px;padding:8px 14px 8px 10px;margin:0 0 14px;border:0;border-radius:16px;background:#fff;color:inherit;text-align:left;box-shadow:0 10px 40px -20px rgba(0,0,0,.18);cursor:pointer;font:inherit}
.mapstrip .mi{width:40px;height:40px;border-radius:11px;flex:none;background:#163A32;display:flex;align-items:center;justify-content:center}
.mapstrip .mt{flex:1;min-width:0;display:flex;flex-direction:column}
.mapstrip .mt b{font-size:14px;font-weight:800}
.mapstrip .mt small{font-size:12px;opacity:.7}
.mapov{position:fixed;inset:0;z-index:1000;background:rgba(12,20,18,.82);display:flex;justify-content:center;overflow:auto;padding:56px 12px 24px}
.mapov[hidden]{display:none}
.mapov img{width:100%;max-width:700px;height:auto;border-radius:14px;align-self:flex-start;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mapov button{position:fixed;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;font-size:22px;line-height:1;cursor:pointer}
</style>

<body>
<div class="mapov" id="mapOv" hidden onclick="if(event.target===this)this.hidden=true"><button type="button" aria-label="닫기" onclick="document.getElementById('mapOv').hidden=true">×</button><img src="/img/roadmap-two-paths.webp" alt="어휘 로드맵 지도: 보카트리 Fundamental 1~4강에서 출발해 어휘요약문 로드맵(BASE CAMP·온더웨이·피날레)과 보카트리 앱 로드맵(Fundamental·Essential·Spectrum)으로 갈라지는 두 갈래 길" loading="lazy"></div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script src="https://www.youtube.com/iframe_api" async></script>
<script>
'use strict';
const C = 'ydvoca', L = YD.lessons, $app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NUMS = ['①','②','③','④','⑤'];
const pad = n => String(n).padStart(2, '0');
const P = {};            // unit_id → row
const VID = {};          // unit → {video_id, chapters}
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2600); }
const data = u => (P[u] && P[u].data) || {};
async function save(u, d, opt){ P[u] = Object.assign({}, P[u], { data: d, score: opt && opt.score, max_score: opt && opt.max, completed: (P[u] && P[u].completed) || !!(opt && opt.completed) });
  try { await VT.save(C, u, d, opt || {}); } catch(e){ toast(e.message === 'COURSE_LOCKED' ? '우리 반에서 열리지 않은 과정이에요.' : '저장하지 못했어요. 인터넷 연결을 확인해 주세요.'); } }
async function loadAll(){
  try { (await VT.load(C)).forEach(r => P[r.unit_id] = r); } catch(e){}
  try { const r = await VT.sb.from('hub_videos').select('unit,video_id,chapters').eq('course', C); (r.data || []).forEach(v => { if (v.video_id) VID[v.unit] = v; }); } catch(e){}
}
/* ---------- 상태 요약 ---------- */
function stat(l){
  const t = data(l.id + '-test'), v = data(l.id + '-v'), s = data(l.id + '-sum');
  const tries = Object.keys(s.tries || {}).length, nq = l.exams.reduce((a, e) => a + e.qs.length, 0);
  return { passed: !!t.passed, best: t.best, attempts: (t.attempts || []).length + (t.paper || []).length, vc: (v.c || {}).done, vs: (v.s || {}).done, tries, nq };
}
/* ---------- 홈 ---------- */
function home(){
  const lc = L.map(l => { const s = stat(l);
    const tp = s.passed ? '<span class="pill pass">테스트 통과</span>' : s.attempts ? `<span class="pill re">재시험 · 최고 ${s.best ? s.best.total : 0}/30</span>` : '<span class="pill">테스트</span>';
    return `<a class="lc" href="#/${l.id}"><div class="n">${l.no}</div><div class="tt">${esc(l.title)}</div><div class="s">${esc(l.sub)}</div>
      <div class="ic"><span class="pill ${s.vc ? 'on' : ''}">영상${s.vc ? ' ✓' : ''}</span>${tp}<span class="pill ${s.tries ? 'on' : ''}">요약문 ${s.tries}/${s.nq}</span></div></a>`; }).join('');
  const done = L.filter(l => stat(l).passed).length;
  $app.innerHTML = `<div class="hero"><div class="rings"></div><div class="e">VOCA · SUMMARY ROADMAP</div>
    <h1>어휘요약문 로드맵</h1><p>어원으로 단어를 잡고(BASE CAMP) → 시험 범위 어휘를 채우고(온더웨이) → 요약문 어휘로 마무리(피날레). 순서대로 하되, 필요한 단계는 언제든 열어 볼 수 있어요.</p>
    <div class="steps"><span><b>STEP 1</b>BASE CAMP · ${done}/4 통과</span><span><b>STEP 2</b>온더웨이 On the Way</span><span><b>STEP 3</b>피날레 Finale</span></div></div>
    <button class="mapstrip" type="button" onclick="document.getElementById('mapOv').hidden=false"><span class="mi"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F5C518" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 21c0-6 10-6 10-12V3"/><path d="M17 21c0-5-6-6-8-9" stroke="#7FC4B0"/></svg></span><span class="mt"><b>어휘 로드맵 지도</b><small>보카트리 앱 로드맵 · 어휘요약문 로드맵 한눈에 보기</small></span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#86868b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <div class="sec"><b>STEP 1 · 어휘요약문 BASE CAMP</b><span>보카트리 Fundamental 1~4강</span></div>
    <div class="dual" style="grid-template-columns:1fr"><div class="dc bc"><b>⛺ BASE CAMP · 강의<span class="k">영상강의 온라인 학습실</span></b>보카트리 Fundamental 1~4강을 영상강의로 듣고, 리뷰 테스트와 요약문 서술형으로 <b style="display:inline;font-size:inherit">내신 실전까지</b> 연결해요.</div></div>
        <div class="grid">${lc}</div>
    <div class="row" style="margin-top:10px"><button class="b pdf" data-dl="yd-book" data-name="보카트리_Fundamental_개정판_전체"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9.5 14.5 12 17l2.5-2.5"/></svg>교재 전체 PDF</button>${VT.allowed('fundamental') ? '<a class="b app" href="/fundamental/"><img class="ai" src="/fundamental/icon-192.png" alt=""><span>보카트리 Fundamental 앱에서 연습하기</span><span class="go">›</span></a>' : ''}</div>
    <div class="sec"><b>STEP 2 · ON THE WAY</b><span>시험 범위 자투리 어휘</span></div>
    <div class="soon">${FULL ? '<b>Season 1 (1학기) · Season 2 (2학기)</b><br>자료를 정리하고 있어요. 열리면 이 자리에 Day별로 나타나요.' : '<b>🔒 내신 어휘요약문 반 전용</b><br>학교 시험 범위에 맞춘 단계라 내신반에서 열려요. BASE CAMP는 누구나 끝까지 할 수 있어요.'}</div>
    <div class="sec"><b>STEP 3 · FINALE</b><span>요약문 어휘 완성</span></div>
    <div class="soon">${FULL ? '<b>Season 1 · Season 2</b><br>온더웨이 다음 단계예요. 준비되는 대로 열려요.' : '<b>🔒 내신 어휘요약문 반 전용</b><br>온더웨이 다음 단계예요.'}</div>`;
  bindDl();
}

  if (!a) return lesson(l);
  const tt = l.test, re = a.set === 're', B1 = re ? tt.R1 : tt.B1, B2 = re ? tt.R2 : tt.B2;
  const row = (id, txt, ok, right) => `<div class="q"><span class="qn" style="color:${ok ? 'var(--tl)' : 'var(--or)'}">${ok ? '✓' : '✗'} ${id}</span><span class="s">${txt}</span>${ok ? '' : `<div class="fb bad">정답 <b>${esc(right)}</b></div>`}</div>`;
  let h = `<div class="top"><button onclick="location.hash='#/${l.id}'">‹ ${l.no}강</button><div class="t">지난 결과 · ${new Date(a.at).toLocaleString('ko-KR')}</div></div>
    <div class="banner ${a.passed ? 'ok' : 'no'}">${a.passed ? '통과한 시험이에요.' : '통과 전이에요. 틀린 문제를 보고 재시험을 봐요.'} (${re ? '재시험' : '1차'})</div>
    <div class="res"><div><i>A</i><b>${a.A}</b>/10</div><div><i>B</i><b>${a.B}</b>/10</div><div><i>C</i><b>${a.C}</b>/10</div><div class="x"><i>★</i><b>${a.X}</b>/5</div></div>`;
  h += tt.A.map((q, i) => row('A' + pad(i + 1), mk(q.s), a.items['A' + pad(i + 1)], NUMS[q.k - 1] + ' ' + q.o[q.k - 1])).join('');
  h += B1.map((q, i) => row('B' + pad(i + 1), esc(q.q) + ' → ' + esc(q.ko), a.items[(re ? 'R' : 'B') + pad(i + 1)], q.a)).join('');
  h += B2.map((q, i) => row('B' + pad(i + 6), ko(q.ko), a.items[(re ? 'R' : 'B') + pad(i + 6)], q.parts.filter(p => typeof p !== 'string').map(p => p.a).join(' / '))).join('');
  h += tt.C.map((q, i) => row('C' + pad(i + 1), esc(q.d), a.items['C' + pad(i + 1)], q.a)).join('');
  $app.innerHTML = h + `<div class="sticky"><a class="b or" href="#/${l.id}/retest">재시험</a></div>`; scrollTo(0, 0);
}
/* ---------- 요약문 트랙 ---------- */
function summary(l){
  const s = data(l.id + '-sum'), tries = s.tries || {};
  let h = `<div class="top"><button onclick="location.hash='#/${l.id}'">‹ ${l.no}강</button><div class="t">요약문 서술형 · 선택</div></div>
    <div class="card"><h2>해설 강의</h2><p class="d">먼저 영상을 보고 풀어도 되고, 풀어 본 뒤에 봐도 괜찮아요. 점수에는 들어가지 않아요.</p>${videoBlock(l, 's')}</div>`;
  l.exams.forEach(e => {
    h += `<div class="card exam"><h2><span class="no">${esc(e.en)}</span>${esc(e.title)}</h2><img src="${e.img}" alt="${esc(e.title)} 문제" loading="lazy">`;
    e.qs.forEach(q => { const key = String(q.no), tr = tries[key];
      const fields = q.ans.map((a, n) => a[0] === '정답'
        ? `<label>${q.no}번 <select class="pick" data-sq="${key}" data-n="${n}"><option value="">고르기</option>${NUMS.map(x => `<option ${tr && tr.ans[n] === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>`
        : `<label>${esc(a[0])} <input class="blank" data-sq="${key}" data-n="${n}" style="--w:${Math.max(6, a[1].length * .8 + 1)}em" value="${esc(tr ? tr.ans[n] || '' : '')}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>`).join('');
      h += `<div class="aw" data-wrap="${key}"><b style="font:500 14px var(--en)">${q.no}.</b>${fields}</div>
        <div class="row"><button class="b" data-hint="${key}">힌트 (첫 글자·글자 수)</button><button class="b main" data-check="${key}">정답 확인</button></div><div data-out="${key}"></div>`; });
    h += `</div>`;
  });
  $app.innerHTML = h; scrollTo(0, 0); mountVideos();
  const find = key => l.exams.flatMap(e => e.qs).find(q => String(q.no) === key);
  $app.querySelectorAll('[data-hint]').forEach(b => b.onclick = () => { const q = find(b.dataset.hint);
    $app.querySelector(`[data-out="${b.dataset.hint}"]`).innerHTML = `<div class="note" style="margin-top:8px">${q.ans.map(a => a[0] === '정답' ? '보기에서 하나를 골라요.' : `${esc(a[0])} <b>${esc(a[1][0])}</b>${'_ '.repeat(a[1].length - 1)}(${a[1].length}글자)`).join(' · ')}</div>`; });
  $app.querySelectorAll('[data-check]').forEach(b => b.onclick = async () => { const key = b.dataset.check, q = find(key);
    const vals = [...$app.querySelectorAll(`[data-sq="${key}"]`)].map(x => x.value);
    let ok = 0; [...$app.querySelectorAll(`[data-sq="${key}"]`)].forEach((x, n) => { const good = norm(vals[n]) === norm(q.ans[n][1]); if (good) ok++; x.classList.remove('ok', 'bad'); x.classList.add(good ? 'ok' : 'bad'); });
    $app.querySelector(`[data-out="${key}"]`).innerHTML = `<div class="ans">${ok === q.ans.length ? '<b>정답!</b> ' : `<b>${ok}/${q.ans.length}</b> 맞았어요. `}정답 · ${q.ans.map(a => `${esc(a[0] === '정답' ? '' : a[0])} <b>${esc(a[1])}</b>`).join(' · ')}
      ${q.ko ? `<div style="margin-top:6px;color:var(--ink2)">${esc(q.ko)}</div>` : ''}${q.note.length ? `<div style="margin-top:4px">→ ${q.note.map(esc).join(' ')}</div>` : ''}</div>`;
    const u = l.id + '-sum', d = data(u); d.tries = d.tries || {};
    const prev = d.tries[key]; d.tries[key] = { ans: vals, ok, total: q.ans.length, at: Date.now(), n: (prev ? prev.n || 1 : 0) + 1, first: prev ? prev.first : ok };
    const nq = l.exams.reduce((a, e) => a + e.qs.length, 0), done = Object.keys(d.tries).length;
    await save(u, d, { score: done, max: nq, completed: done >= nq });
  });
}
/* ---------- 라우터 ---------- */
function route(){
  const [, id, sub] = (location.hash || '#/').split('/'), l = L.find(x => x.id === id);
  Object.values(PLAYERS).forEach(p => { try { clearInterval(p._t); } catch(e){} });
  if (!l) return home();
  if (sub === 'test') return startTest(l, 'main');
  if (sub === 'retest') return startTest(l, 're');
  if (sub === 'result') return lastResult(l);
  if (sub === 'sum') return summary(l);
  lesson(l); scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
$app.innerHTML = '<div class="note" style="margin-top:40px;text-align:center">불러오는 중…</div>';
loadAll().then(route);
</script>
