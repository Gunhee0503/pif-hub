<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내신 동형모의고사 | PIF Learning Hub</title>
<meta name="theme-color" content="#1B2A4A">
<link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/vt.css">
<script src="/shared/supabase.js"></script>
<script src="/shared/vt.js"></script>
<script>VT.gate('naesin');</script>
<script src="nx-core.js"></script>
<style>
:root{--dk:#1B2A4A;--dk2:#2C3E66;--ac:#C2412D;--acbg:#FBEAE6;--ok:#1F7A5A;--okbg:#E3F3EC;--sky:#EEF2F9;--en:'Oswald',var(--sans);
  --paper:#F3F4F7;--card:#fff;--line:#D5DAE5;--ink:#1B2236;--ink2:#5B6478}
body{background:var(--paper);color:var(--ink)}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 110px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top button,.top a{background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:13px;color:var(--ink2);text-decoration:none}
.top .t{flex:1;font:500 12px/1.3 var(--en);letter-spacing:.18em;color:var(--dk2)}
.hero{background:var(--dk);color:#E8EDF7;border-radius:22px;padding:22px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.hero .e{font:500 12px/1 var(--en);letter-spacing:.28em;color:#F2A08F}
.hero h1{font:800 24px/1.3 var(--sans);margin:9px 0 6px;letter-spacing:-.02em}
.hero p{margin:0;font-size:13.5px;line-height:1.65;color:#C4CEE2}
.hero:after{content:'';position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;box-shadow:0 0 0 14px rgba(255,255,255,.04),0 0 0 32px rgba(255,255,255,.035),0 0 0 54px rgba(255,255,255,.03)}
.hero .how{position:relative;z-index:1;margin-top:12px;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:700}
.sec{margin:24px 0 10px;display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.sec b{font:600 15px/1 var(--en);letter-spacing:.14em;color:var(--dk)} .sec span{font-size:13px;color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.cum{border:2px solid var(--ac);background:#FFF8F6}
.cum h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px} .cum h2 i{font-style:normal;font:500 11px var(--en);letter-spacing:.12em;background:var(--ac);color:#fff;border-radius:6px;padding:4px 7px}
.cum .d{font-size:13px;color:var(--ink2);line-height:1.6;margin:0 0 12px}
.cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.cnt div{background:#fff;border:1px solid #F0D3CC;border-radius:12px;padding:9px 6px;text-align:center}
.cnt i{display:block;font-style:normal;font-size:11.5px;color:var(--ink2)} .cnt b{font:500 24px/1.2 var(--en);color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.b{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.b.main{background:var(--dk);border-color:var(--dk);color:#fff} .b.ac{background:var(--ac);border-color:var(--ac);color:#fff} .b.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.b.sm{padding:6px 11px;font-size:13px;border-radius:10px} .b:disabled{opacity:.45;cursor:default} .b.gh{border-style:dashed;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;display:flex;flex-direction:column;gap:8px}
.ex .h{display:flex;align-items:baseline;gap:10px} .ex .n{font:500 34px/1 var(--en);color:var(--dk)} .ex .n small{font-size:15px;margin-left:2px}
.ex .tt{font-weight:800;font-size:14.5px;line-height:1.35} .ex .rg{font-size:12px;color:var(--ink2);line-height:1.5}
.ex .sc{display:flex;gap:6px;flex-wrap:wrap} .pill{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:#EEF0F5;color:#6B7385}
.pill.on{background:var(--sky);color:var(--dk)} .pill.ac{background:var(--acbg);color:var(--ac)} .pill.ok{background:var(--okbg);color:var(--ok)}
.ex .bt{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:auto} .ex .bt .b{justify-content:center;padding:9px 4px;font-size:13px}
.ex .bt .b small{display:block;font-weight:500;font-size:10.5px;opacity:.75}
.ex .last{font-size:12.5px;color:var(--ink2);text-decoration:none} .ex .last b{color:var(--dk)}
.note{font-size:12.5px;line-height:1.6;color:var(--ink2);background:var(--sky);border-radius:12px;padding:10px 12px}
.banner{border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.55;margin-bottom:12px;background:var(--sky);color:var(--dk2)}
/* 문항 */
.sh{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--dk);padding-bottom:7px;margin:24px 0 10px}
.sh .k{background:var(--dk);color:#fff;font:500 14px/1 var(--en);letter-spacing:.1em;padding:6px 9px;border-radius:6px} .sh b{font-size:15.5px;color:var(--dk)} .sh span{font-size:12.5px;color:var(--ink2)}
.q{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;scroll-margin-top:60px}
.q .qh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.q .qn{font:500 13px/1 var(--en);letter-spacing:.06em;color:#fff;background:var(--dk2);border-radius:6px;padding:5px 8px}
.q .qt{font-size:12.5px;color:var(--ink2);font-weight:700} .q .qp{margin-left:auto;font:500 13px var(--en);color:var(--ink2)}
.q img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid #EEF0F5;background:#fff}
.q img+img{margin-top:6px}
.opts{display:flex;gap:8px;justify-content:center;margin:12px 0 2px}
.opts button{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:22px;color:var(--dk);line-height:1}
.opts button.sel{background:var(--dk);border-color:var(--dk);color:#fff}
.opts button.ok{background:var(--ok);border-color:var(--ok);color:#fff} .opts button.bad{background:var(--acbg);border-color:var(--ac);color:var(--ac)}
.ins{display:flex;flex-direction:column;gap:8px;margin:12px 0 2px}
.ins .r{display:flex;align-items:center;gap:7px}
.ins .r b{flex:none;width:52px;font:600 14px var(--en);color:var(--dk)} .ins .r i{font-style:normal;color:var(--ink2)}
.ins input,.ins select{flex:1;min-width:0;font:600 16px var(--sans);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
.ins select{flex:none;width:74px;padding:9px 4px}
.ins input:focus{outline:none;border-color:var(--dk2);background:var(--sky)}
.ins .ok{border-color:var(--ok);background:var(--okbg)} .ins .bad{border-color:var(--ac);background:var(--acbg)}
.ins input:disabled,.ins select:disabled{color:var(--ink);opacity:1}
.lbx{position:relative;flex:1;min-width:0;display:flex;gap:3px;max-width:520px}
.lbx .c{flex:1 1 0;min-width:0;max-width:30px;height:40px;border:1.5px solid var(--line);border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;font:700 18px var(--sans);color:var(--ink);text-transform:lowercase}
.lbx.sm{gap:2px} .lbx.sm .c{font-size:14px;border-radius:5px}
.lbx .c.f{background:var(--sky);border-color:#C6D0E3;color:var(--dk2)}
.lbx .c.cur{border-color:var(--dk2);box-shadow:0 0 0 2px rgba(44,62,102,.18)}
.ins .lbx input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;font-size:16px;cursor:text}
.ins .lbx.ok,.ins .lbx.bad{background:none;border:0} .lbx.ok .c:not(.f){border-color:var(--ok);background:var(--okbg)} .lbx.bad .c:not(.f){border-color:var(--ac);background:var(--acbg)}
.chk{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.fb{margin-top:10px;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6}
.fb.ok{background:var(--okbg);color:#145440} .fb.bad{background:var(--acbg);color:#8E2B1C} .fb.mid{background:#FFF4DD;color:#7A5300}
.fb .ans{font-weight:800;color:var(--ink)} .fb .grad{font-weight:800}
.exp{margin-top:8px;background:#F7F8FB;border:1px solid #E5E8F0;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.7}
.exp div+div{margin-top:6px} .exp i{display:inline-block;font-style:normal;font-weight:800;font-size:12px;color:var(--ac);margin-right:6px}
.exp .tx{white-space:pre-line}
.claim{margin-top:8px;font-size:12.5px;color:var(--ink2)} .claim .b{font-size:12.5px}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:99px;padding:3px 8px} .tag.wait{background:#FFF4DD;color:#7A5300} .tag.yes{background:var(--okbg);color:var(--ok)} .tag.no{background:var(--acbg);color:var(--ac)}
.q.qd{padding:10px 12px;background:#FAFBFD} .q.qd .qh{margin:0} .q.qd .pill{margin-left:auto}
.q.qd details{margin-top:6px} .q.qd summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--dk2)} .q.qd details[open] summary{margin-bottom:8px}
/* 하단 바 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .tm{font:500 22px/1 var(--en);color:var(--dk);letter-spacing:.04em} .bar .tm.warn{color:var(--ac)} .bar .st{flex:1;font-size:12.5px;color:var(--ink2)}
.navs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 6px}
.navs a{width:30px;height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;font:500 12.5px/26px var(--en);text-align:center;color:var(--ink2);text-decoration:none}
.navs a.on{background:var(--dk2);border-color:var(--dk2);color:#fff} .navs a.ok{background:var(--okbg);border-color:#9FD3BE;color:var(--ok)} .navs a.bad{background:var(--acbg);border-color:#EDB1A6;color:var(--ac)}
.navs .lb{font:600 11px/28px var(--en);color:var(--ink2);margin-right:4px;letter-spacing:.08em}
/* 결과 */
.res{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;margin-bottom:12px}
.res div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.res i{display:block;font-style:normal;font-size:12px;color:var(--ink2)} .res b{font:500 30px/1.2 var(--en);color:var(--dk)} .res b small{font-size:14px;color:var(--ink2)}
.res .big{background:var(--dk);border-color:var(--dk)} .res .big i{color:#C4CEE2} .res .big b{color:#fff} .res .big b small{color:#C4CEE2}
.rq{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.rq .rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .rq .mk{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex:none}
.rq .mk.o{background:var(--ok)} .rq .mk.x{background:var(--ac)} .rq .mk.h{background:#E0A23A}
.rq .lb{font-weight:800;font-size:14px} .rq .ty{font-size:12px;color:var(--ink2)} .rq .pt{margin-left:auto;font:500 14px var(--en);color:var(--ink2)}
.rq .cmp{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px;margin-top:7px;line-height:1.5} .rq .cmp i{font-style:normal;font-size:12px;color:var(--ink2)} .rq .cmp .c{font-weight:800;color:var(--ok)}
.rq details{margin-top:6px} .rq summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--dk2)}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.flt button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--ink2)} .flt button.on{background:var(--dk);border-color:var(--dk);color:#fff}
.nl{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.nl h3{margin:0;padding:10px 12px;font-size:14px;background:var(--sky);color:var(--dk)}
.ni{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid #EEF0F5;font-size:13.5px}
.ni .w{flex:1;min-width:0} .ni .w b{margin-right:6px} .ni .w small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.ni.out{opacity:.55}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:var(--dk);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:70;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--ink2);padding:40px 10px;font-size:14px;line-height:1.7}
.pop{position:fixed;inset:0;z-index:80;background:rgba(15,20,35,.55);display:flex;align-items:center;justify-content:center;padding:18px}
.pop .box{background:#fff;border-radius:20px;max-width:440px;width:100%;padding:20px;max-height:92vh;overflow:auto}
.pop .box .e{font:600 11px var(--en);letter-spacing:.2em;color:var(--ac)} .pop .box h3{margin:4px 0 10px;font-size:20px;color:var(--dk)}
.pop ol{margin:0 0 14px;padding:0;list-style:none;counter-reset:p} .pop li{counter-increment:p;display:grid;grid-template-columns:28px 1fr;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.pop li:before{content:counter(p);grid-row:span 2;width:26px;height:26px;border-radius:50%;background:var(--dk);color:#fff;font:700 13px var(--sans);display:flex;align-items:center;justify-content:center}
.pop li b{font-size:14.5px;color:var(--dk)} .pop li span{font-size:13px;line-height:1.55;color:var(--ink2)} .pop li em{font-style:normal;font-weight:800;color:var(--ac)}
@media (max-width:520px){.res{grid-template-columns:1fr 1fr}.res .big{grid-column:span 2}.opts button{width:44px;height:44px;font-size:20px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">불러오는 중…</div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
